name: Build and Publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the plugin to JetBrains Marketplace'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build & Publish
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Plugin
        run: ./gradlew buildPlugin

      - name: Run Tests
        run: ./gradlew testDotNet

      - name: Publish Plugin
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        shell: pwsh
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          if (-not $env:PUBLISH_TOKEN) {
            Write-Error "PUBLISH_TOKEN secret is not set. Please add it to GitHub Secrets."
            exit 1
          }
          ./gradlew publishPlugin -PPublishToken="$env:PUBLISH_TOKEN"
